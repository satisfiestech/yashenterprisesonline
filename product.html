<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book Details</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
  <header class="header">
  <div class="container">
    <div class="header-content">
      <a href="index.html" class="logo-section">
        <img src="logo.svg" alt="Yash Enterprises" class="logo"/>
        <div class="logo-text">
          <h1 class="brand-name">Yash Enterprises</h1>
          <p class="brand-tagline">Premium Book Hub</p>
        </div>
      </a>
      
      <div class="search-wrapper">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search books, authors..." oninput="searchBooks(this.value)"/>
      </div>

      <div class="header-actions">
        <button class="cart-btn" onclick="toggleCart()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </div>
</header>

<main class="container product-page" id="productRoot">
  <!-- JS will populate product details here -->
</main>

<!-- CART SIDEBAR (copied from index.html) -->
<div class="cart-sidebar" id="cartSidebar">
  <div class="cart-header">
    <h3><i class="fas fa-shopping-cart"></i> Your Cart</h3>
    <button onclick="toggleCart()"><i class="fas fa-times"></i></button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="cart-totals">
      <div class="cart-total-row"><span>Books Subtotal</span><strong id="cartTotal">₹0</strong></div>
      <div class="cart-total-row"><span>Handling Charges</span><strong id="cartHandling">₹0</strong></div>
      <div class="cart-total-row"><span>Courier Charges</span><strong id="cartCourier">₹0</strong></div>
      <div class="cart-total-row grand-row"><span>Grand Total</span><strong id="cartGrand">₹0</strong></div>
    </div>
    <button class="btn-checkout" onclick="openCheckout()"><i class="fas fa-lock"></i> Proceed to Checkout</button>
  </div>
</div>
<div class="overlay" id="overlay" onclick="closeAll()"></div>


  <footer>
    <p>© 2026 Yash Enterprises Online</p>
  </footer>

  <script>window.APPS_SCRIPT_URL = 'YOUR_APPS_SCRIPT_WEB_APP_URL';</script>
  <script src="app.js"></script>
</body>
</html>
